# ================================
# Application Name
# ================================
spring.application.name=advanced-auth-system

# ================================
# DBMS properties
# ================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO

# ================================
# HikariCP Tuning
# ================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ================================
# Flyway
# ================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ================================
# JWT
# ================================
jwt.secret=${JWT_SECRET}
jwt.access.expiration=900000
jwt.refresh.expiration=604800000

# ================================
# Verification
# ================================
verification.token.expiry-minutes=15

# ================================
# Email (SMTP)
# ================================
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ================================
# Redis (CRITICAL: SSL Added)
# ================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
# Cloud Redis usually requires SSL. Default to true for prod.
spring.data.redis.ssl.enabled=${REDIS_SSL:false}


spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# ================================
# OAuth2 (Google & GitHub)
# ================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id

# ================================
# Security & Network
# ================================
security.hsts.enabled=true
security.hsts.max-age-seconds=31536000
security.hsts.include-sub-domains=true
security.hsts.preload=true

security.oauth.allowed-redirect-uris=${OAUTH_ALLOWED_REDIRECT_URIS}

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Strict

# CORS (Dynamic)
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# Base URL
app.base-url=${APP_BASE_URL}

server.forward-headers-strategy=native

# ================================
# Actuator (Health Checks)
# ================================
# Ensure health endpoint is exposed for AWS App Runner
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ================================
# Resilience4j
# ================================
# (Kept your existing config, it is fine)
resilience4j.retry.instances.ipMonitoringRetry.max-attempts=3
resilience4j.retry.instances.ipMonitoringRetry.wait-duration=200ms
resilience4j.circuitbreaker.instances.ipMonitoringCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ipMonitoringCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.ipMonitoringCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ipMonitoringCB.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.ipMonitoringCB.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.emailRetry.max-attempts=3
resilience4j.retry.instances.emailRetry.wait-duration=500ms
resilience4j.retry.instances.emailRetry.retry-exceptions=java.lang.Exception
resilience4j.circuitbreaker.instances.emailCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.emailCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.emailCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.emailCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.emailCB.automatic-transition-from-open-to-half-open-enabled=true

spring.jackson.deserialization.fail-on-unknown-properties=true
auth.risk.threshold.high=80
auth.risk.threshold.medium=40

app.frontend.url=${FRONTEND_URL}
