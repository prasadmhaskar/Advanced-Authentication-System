# Cleaned up application-test.properties
# Spring Boot Testcontainers will inject DB URL/User/Pass
# We let the AbstractIntegrationTest handle the driver class name dynamically

# --- SECURITY ---
# Keep these constant for predictable testing
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.access.expiration=900000
jwt.refresh.expiration=604800000

# --- MOCKS ---
spring.security.oauth2.client.registration.google.client-id=mock-google-id
spring.security.oauth2.client.registration.google.client-secret=mock-google-secret
spring.security.oauth2.client.registration.github.client-id=mock-github-id
spring.security.oauth2.client.registration.github.client-secret=mock-github-secret

# --- APP CONFIG ---
app.base-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:3000

# --- LOGGING ---
logging.level.com.pnm.auth=DEBUG
# Useful to see SQL during test failures
logging.level.org.hibernate.SQL=INFO 
spring.jpa.show-sql=true
# ... existing properties ...

# DISABLE MAIL HEALTH CHECK (Fixes BeanCreationException with Mocks)
management.health.mail.enabled=false